<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Академический сервис — Загрузка документов</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="upload.css">
</head>
<body>
    <div class="container">
        <h1 class="step-title">Шаг 1: Выберите тип документа ЛНА</h1>
        <div class="document-selection">
            <div class="document-card" data-type="instruction">
                <span>Инструкция по охране труда (Приказ 772н)</span>
            </div>
            <div class="document-card" data-type="journal">
                <span>Журнал инструктажей (Постановление 2464)</span>
            </div>
        </div>

        <h1 class="step-title">Шаг 2: Загрузите файл документа</h1>
        <div class="upload-zone" id="uploadZone">
            <p>Перетащите файлы сюда или нажмите кнопку ниже</p>
            <input type="file" id="fileInput" accept=".docx,.pdf" style="display:none;">
            <button type="button" style="margin-top:12px;" onclick="document.getElementById('fileInput').click()">Выбрать файлы</button>
        </div>

        <button class="submit-button" id="submitBtn">Начать экспресс-аудит</button>
    </div>
    <script src="upload.js"></script>
</body>
</html>
