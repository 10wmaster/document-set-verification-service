<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Спецификация отчета нормоконтроля</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-area">
                <h2>Результаты проверки</h2>
                <p class="file-meta">Документ: <strong id="doc-name">—</strong></p>
            </div>
            <button class="btn-back" onclick="window.location.href='/'">Проверить еще один</button>
        </header>

        <main class="results-layout">
            <div class="panel summary-panel">
                <div class="score-radial">
                    <span class="score-val" id="compliance-score">0</span>
                    <span class="score-max">из 100</span>
                </div>
                <h3>Соответствие стандартам</h3>

                <div class="metrics-list">
                    <div class="metric-box crit">
                        <span class="lbl">Критические ошибки</span>
                        <strong class="val" id="crit-count">0</strong>
                    </div>
                    <div class="metric-box warn">
                        <span class="lbl">Предупреждения</span>
                        <strong class="val" id="warn-count">0</strong>
                    </div>
                    <div class="metric-box info">
                        <span class="lbl">Проверено страниц</span>
                        <strong class="val" id="pages-count">0</strong>
                    </div>
                </div>

                <button class="btn-download" id="download-report-btn">Выгрузить PDF-заключение</button>
            </div>

            <div class="panel details-panel">
                <h3>Подробный анализ по ГОСТ</h3>
                <div id="gost-list" class="gost-items-container"></div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const resultData = JSON.parse(sessionStorage.getItem('gost_results'));
            if (!resultData) {
                window.location.href = '/';
                return;
            }

            document.getElementById('doc-name').textContent = resultData.filename;
            document.getElementById('compliance-score').textContent = resultData.score;
            document.getElementById('crit-count').textContent = resultData.stats.critical_errors;
            document.getElementById('warn-count').textContent = resultData.stats.warnings;
            document.getElementById('pages-count').textContent = resultData.stats.verified_pages;

            const listContainer = document.getElementById('gost-list');
            resultData.gosts.forEach(gost => {
                const gostElement = document.createElement('div');
                gostElement.className = `gost-card-item status-${gost.status}`;
                let statusLabel = gost.status === 'success' ? 'Успешно' : gost.status === 'warning' ? 'Внимание' : 'Ошибка';

                gostElement.innerHTML = `
                    <div class="gost-card-header">
                        <span class="gost-title-text">${gost.name}</span>
                        <span class="status-badge">${statusLabel}</span>
                    </div>
                    <div class="gost-card-body">
                        <p>${gost.details}</p>
                    </div>
                `;
                listContainer.appendChild(gostElement);
            });

            document.getElementById('download-report-btn').addEventListener('click', () => {
                window.location.href = '/api/report/download';
            });
        });
    </script>
</body>
</html>
